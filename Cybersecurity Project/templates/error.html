{% extends "base.html" %}

{% block title %}Error {{ error_code }} | SecureScan Web Security Scanner{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="soc-card p-5">
            <div class="mb-4">
                <i class="bi bi-shield-x fs-1 text-danger" style="filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.4));"></i>
            </div>
            <span class="badge bg-danger mb-2 font-monospace">Error {{ error_code }}</span>
            <h2 class="h3 fw-bold text-white mb-2">{{ error_title }}</h2>
            <p class="text-muted small mb-4">
                {{ error_message }}
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-cyan btn-sm px-3">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
                <a href="{{ url_for('demo_page') }}" class="btn btn-outline-secondary btn-sm px-3">
                    <i class="bi bi-cpu me-1"></i> Open Demo Lab
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
